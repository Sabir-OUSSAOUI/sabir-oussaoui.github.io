<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Events - Sabir Oussaoui</title>
<link rel="icon" href="images/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css?v=202610281549">
<script>try{if((localStorage.getItem("theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"))==="dark")document.documentElement.classList.add("dark")}catch(e){}</script>
</head>
<body data-page="events">
<div class="transition" aria-hidden="true"><span></span><span></span><span></span></div>
<header class="nav" id="header"></header>

<main class="wrap">
  <section style="padding-top:48px">
    <h1 class="title" id="evTitle"></h1>
    <p id="evLede" style="text-align:center;max-width:720px;margin:-32px auto 56px;font-weight:500;color:var(--muted)"></p>
    <div class="event-list" id="evList"></div>
  </section>
</main>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="lbCap">
  <figure style="margin:0;display:flex;flex-direction:column;align-items:center;gap:14px;max-width:100%">
    <div class="lb-stage"><button class="lb-nav" id="lbPrev" aria-label="Previous image">&#8249;</button><img id="lbImg" src="" alt=""><button class="lb-nav" id="lbNext" aria-label="Next image">&#8250;</button></div>
    <figcaption id="lbCap"></figcaption>
  </figure>
  <button class="btn" id="lbClose">Close</button>
</div>

<footer id="footer"></footer>
<script src="js/data.js?v=202610281549"></script>
<script src="js/main.js?v=202610281549"></script>
</body>
</html>
