<body data-page="pubs">
<div class="transition" aria-hidden="true"><span></span><span></span><span></span></div>
<header class="nav" id="header"></header>

<main class="wrap">
  <section style="padding-top:48px">
    <h1 class="title" id="pubTitle"></h1>
    <p id="pubLede" style="text-align:center;max-width:720px;margin:-32px auto 56px;font-weight:500;color:var(--muted)"></p>

    <ul class="pub-list" id="pubList"></ul>

    <div style="display:flex;gap:16px;flex-wrap:wrap;margin-top:28px;align-items:center">

  <section style="padding-top:0">
    <h2 class="title" id="talksTitle" style="font-size:40px"></h2>
    <ul class="talks" id="talks"></ul>
    <div class="rule"></div>

    <figcaption id="lbCap"></figcaption>
  </figure>
  <button class="btn" id="lbClose">Close</button>
</div>

<footer id="footer"></footer>
